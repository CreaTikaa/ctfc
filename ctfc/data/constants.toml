# Well-known crypto constants. If one of them is found in a binary or a script,
# that algorithm is probably implemented there.
#
# [[const]]
#   name : what it is
#   algo : algorithm family (shown to the user)
#   hex  : the bytes as stored in memory. Multi-byte integers are listed twice,
#          once per byte order ("LE" = little-endian, as on x86).
#
# detect.py also searches the hex text form ("9e3779b9" / "0x9e3779b9") so that
# constants written in source code are found too.

[[const]]
name = "AES S-box (first 16 bytes)"
algo = "AES"
hex = "637c777bf26b6fc53001672bfed7ab76"

