# External tools ctfc can point you at, with the rule that makes each one relevant.
#
# ctfc reimplements the *ideas* it needs (XOR solving, file signatures, hash
# identification) and calls the real tool when one is installed and better. It
# never vendors xortool or Detect It Easy (CLAUDE.md section 4.8).
#
# Fields:
#   id                short name
#   name              what it is
#   kind              "online" (sends data to a third party) | "local" (a program
#                     on this machine) | "embedded" (vendored, served locally)
#   command_template  for local tools: the command, as a list of arguments.
#                     {input} is replaced by the file path, {keylen} etc. by the
#                     values the firing rule provides. NEVER a shell string: ctfc
#                     runs argument lists only (hard rule 4).
#   url_template      for online tools: {recipe} and {input} are filled in
#   suggest_when      rule ids from detect / lens; the tool is suggested when one
#                     of them fired with enough confidence
#   offline_safe      true when using it sends nothing anywhere
#   prefer_over       (optional) ids not suggested when this tool is available:
#                     the embedded CyberChef replaces the public instance
#   install           how to get it, shown when it is missing
#   notes             why it is the right tool here
#
# Suggestions are capped (config `max_suggestions`, default 3) and only appear
# above `suggest_threshold` (default 0.7), so a confident guess shows one tool and
# an unsure one shows nothing.

[[tool]]
id = "cyberchef_local"
name = "CyberChef (embedded copy)"
kind = "embedded"
url_template = "{cyberchef_url}#recipe={recipe}&input={input}"
suggest_when = ["base64.*", "escapes.*", "charcodes", "ascii85", "uuencode", "xor.*", "aes.*", "jwt"]
offline_safe = true
prefer_over = ["cyberchef_public"]
install = "scripts/fetch_vendor.sh (downloads the official release into web/static/vendor/)"
notes = "the same tool as the public instance, served from this machine: nothing leaves it"

[[tool]]
id = "cyberchef_public"
name = "CyberChef (public instance)"
kind = "online"
url_template = "https://gchq.github.io/CyberChef/#recipe={recipe}&input={input}"
suggest_when = ["base64.*", "escapes.*", "charcodes", "ascii85", "uuencode", "xor.*", "aes.*", "jwt"]
offline_safe = false
install = ""
notes = "the data travels in the URL fragment: fine for a CTF sample, never for real evidence"

[[tool]]
id = "dcode"
name = "dcode.fr"
kind = "online"
url_template = "https://www.dcode.fr/en"
suggest_when = ["classical.*", "base64.custom_alphabet", "morse", "brainfuck"]
offline_safe = false
install = ""
notes = "good for classical ciphers and odd alphabets; the page is opened, the data is not sent for you"

[[tool]]
id = "xortool"
name = "xortool"
kind = "local"
command_template = ["xortool", "-l", "{keylen}", "{input}"]
suggest_when = ["xor.repeating"]
offline_safe = true
install = "pipx install xortool"
notes = "a second opinion on the key length; ctfc's own XOR solver already tried"

[[tool]]
id = "xortool_auto"
name = "xortool (guess the length)"
kind = "local"
command_template = ["xortool", "{input}"]
suggest_when = ["xor.simple"]
offline_safe = true
install = "pipx install xortool"
notes = "when the period is unclear, xortool ranks the candidate lengths differently"

[[tool]]
id = "diec"
name = "Detect It Easy"
kind = "local"
command_template = ["diec", "{input}"]
suggest_when = ["magic.exe", "magic.elf", "const.*", "entropy.high"]
offline_safe = true
install = "apt install detect-it-easy, or https://github.com/horsicq/Detect-It-Easy"
notes = "identifies packers, compilers and crypto in executables far beyond our signature table"

[[tool]]
id = "binwalk"
name = "binwalk"
kind = "local"
command_template = ["binwalk", "-e", "--run-as=root", "{input}"]
suggest_when = ["polyglot.trailing", "embedded", "entropy.mixed"]
offline_safe = true
install = "apt install binwalk"
notes = "carves embedded files out; then run `ctfc scan` on the extraction folder"

[[tool]]
id = "hashcat"
name = "hashcat"
kind = "local"
command_template = ["hashcat", "-m", "{hashcat_mode}", "-a", "0", "{input}", "{wordlist}"]
suggest_when = ["hash.*"]
offline_safe = true
install = "apt install hashcat"
notes = "ctfc identifies the format and gives the mode; hashcat does the cracking"

[[tool]]
id = "john"
name = "john the ripper"
kind = "local"
command_template = ["john", "--format={john_format}", "{input}"]
suggest_when = ["hash.*"]
offline_safe = true
install = "apt install john"
notes = "handles formats hashcat does not, and the *2john extractors come with it"

[[tool]]
id = "openssl"
name = "openssl"
kind = "local"
command_template = ["openssl", "enc", "-d", "-aes-256-cbc", "-md", "md5", "-pass", "pass:{password}", "-in", "{input}"]
suggest_when = ["magic.enc", "openssl.salted_b64"]
offline_safe = true
install = "apt install openssl"
notes = "the reference implementation; ctfc prints the exact command for the KDF that worked"

[[tool]]
id = "rsactftool"
name = "RsaCtfTool"
kind = "local"
command_template = ["RsaCtfTool", "--publickey", "{input}", "--private"]
suggest_when = ["pem"]
offline_safe = true
install = "pipx install git+https://github.com/RsaCtfTool/RsaCtfTool"
notes = "more RSA attacks than ctfc has (lattices, factordb); try ctfc rsa --attack first, it is offline"

[[tool]]
id = "factordb"
name = "factordb.com"
kind = "online"
url_template = "https://factordb.com/index.php?query={modulus}"
suggest_when = ["pem"]
offline_safe = false
install = ""
notes = "a lookup of already-factored moduli: CTF keys are often in there. Sends the modulus"

[[tool]]
id = "exiftool"
name = "exiftool"
kind = "local"
command_template = ["exiftool", "{input}"]
suggest_when = ["magic.jpg", "magic.png", "magic.gif", "magic.pdf", "magic.tif"]
offline_safe = true
install = "apt install libimage-exiftool-perl"
notes = "metadata: comments and GPS tags are a classic hiding place. ctfc reads EXIF itself now (`ctfc stego photo.jpg`); exiftool knows the maker notes and the thousand vendor tags it does not"

[[tool]]
id = "zsteg"
name = "zsteg"
kind = "local"
command_template = ["zsteg", "-a", "{input}"]
suggest_when = ["magic.png", "magic.bmp"]
offline_safe = true
install = "gem install zsteg"
notes = "LSB steganography in PNG and BMP. ctfc tries the common channel orders and bit planes itself (`ctfc stego`); zsteg tries the exotic ones and the colour-palette tricks"

[[tool]]
id = "zbarimg"
name = "zbarimg"
kind = "local"
command_template = ["zbarimg", "--quiet", "-Sdisable", "-Sqrcode.enable", "-Scode128.enable", "{input}"]
suggest_when = ["magic.png", "magic.jpg", "magic.gif", "magic.bmp", "magic.tif"]
offline_safe = true
install = "apt install zbar-tools"
notes = "reads a QR code or a barcode out of an image. ctfc does not: decoding a damaged QR properly (its Reed-Solomon correction, its masks, its versions) is a project of its own, and this does it in one call"

[[tool]]
id = "steghide"
name = "steghide"
kind = "local"
command_template = ["steghide", "info", "{input}"]
suggest_when = ["magic.jpg", "magic.bmp", "magic.riff"]
offline_safe = true
install = "apt install steghide"
notes = "password-protected steganography; stegseek cracks the password fast"

[[tool]]
id = "stegseek"
name = "stegseek"
kind = "local"
command_template = ["stegseek", "{input}", "{wordlist}"]
suggest_when = ["magic.jpg", "magic.bmp", "magic.riff"]
offline_safe = true
install = "https://github.com/RickdeJager/stegseek/releases"
notes = "brute-forces a steghide passphrase through a wordlist, very fast"

[[tool]]
id = "tshark"
name = "tshark"
kind = "local"
command_template = ["tshark", "-r", "{input}", "-q", "-z", "conv,tcp"]
suggest_when = ["magic.pcap", "magic.pcapng"]
offline_safe = true
install = "apt install tshark"
notes = "ctfc pcap covers HTTP and DNS; tshark reads every other protocol"

[[tool]]
id = "foremost"
name = "foremost"
kind = "local"
command_template = ["foremost", "-i", "{input}", "-o", "{output}"]
suggest_when = ["polyglot.trailing", "embedded"]
offline_safe = true
install = "apt install foremost"
notes = "another carver, with different signatures than binwalk; then `ctfc scan` the output"

# --- Hash extractors (the *2john family): turn a password-protected file into a
# hash line, which you then paste into `ctfc hash` to get the hashcat/john mode,
# then crack. They print the hash to stdout; they do not crack anything themselves.

[[tool]]
id = "zip2john"
name = "zip2john"
kind = "local"
command_template = ["zip2john", "{input}"]
suggest_when = ["magic.zip"]
offline_safe = true
install = "comes with john the ripper (apt install john, the 'jumbo' build)"
notes = "password-protected ZIP: prints a $zip2$/$pkzip$ hash. Paste it into `ctfc hash`, then hashcat -m 13600/17200. Known-plaintext instead? see bkcrack"

[[tool]]
id = "rar2john"
name = "rar2john"
kind = "local"
command_template = ["rar2john", "{input}"]
suggest_when = ["magic.rar"]
offline_safe = true
install = "comes with john the ripper (jumbo build)"
notes = "password-protected RAR: prints a $rar5$/$RAR3$ hash for `ctfc hash` -> hashcat -m 13000/12500"

[[tool]]
id = "sevenz2john"
name = "7z2john"
kind = "local"
command_template = ["7z2john.pl", "{input}"]
suggest_when = ["magic.7z"]
offline_safe = true
install = "comes with john the ripper (jumbo build); the script is run/7z2john.pl"
notes = "encrypted 7z: prints a $7z$ hash for `ctfc hash` -> hashcat -m 11600"

[[tool]]
id = "pdf2john"
name = "pdf2john"
kind = "local"
command_template = ["pdf2john.pl", "{input}"]
suggest_when = ["magic.pdf"]
offline_safe = true
install = "comes with john the ripper (jumbo build); the script is run/pdf2john.pl"
notes = "password-protected PDF: prints a $pdf$ hash for `ctfc hash` -> hashcat -m 10400..10700"

[[tool]]
id = "keepass2john"
name = "keepass2john"
kind = "local"
command_template = ["keepass2john", "{input}"]
suggest_when = ["magic.kdbx", "magic.kdb"]
offline_safe = true
install = "comes with john the ripper (jumbo build)"
notes = "KeePass database: prints a $keepass$ hash for `ctfc hash` -> hashcat -m 13400. The master password unlocks every entry"

[[tool]]
id = "office2john"
name = "office2john"
kind = "local"
command_template = ["office2john.py", "{input}"]
suggest_when = ["magic.doc"]
offline_safe = true
install = "comes with john the ripper (jumbo build); the script is run/office2john.py"
notes = "password-protected MS Office (.doc/.xls or OOXML): prints a $office$ hash for `ctfc hash` -> hashcat -m 9400..9800"

[[tool]]
id = "olevba"
name = "olevba (oletools)"
kind = "local"
command_template = ["olevba", "{input}"]
suggest_when = ["magic.doc"]
offline_safe = true
install = "pipx install oletools"
notes = "OLE2 document: extracts and deobfuscates VBA macros statically. The usual place a .doc hides its payload"

[[tool]]
id = "oleid"
name = "oleid (oletools)"
kind = "local"
command_template = ["oleid", "{input}"]
suggest_when = ["magic.doc"]
offline_safe = true
install = "pipx install oletools"
notes = "OLE2 document: flags macros, encryption and other risk indicators at a glance"

# --- Known-plaintext attack on a ZipCrypto archive. ctfc works out the three
# arguments (which entry, the plaintext magic, its offset in the ciphertext) and
# only fires when it could; bkcrack then recovers the keys. See core/repair.py.

[[tool]]
id = "bkcrack"
name = "bkcrack"
kind = "local"
command_template = ["bkcrack", "-C", "{input}", "-c", "{zip_entry}", "-x", "{bkcrack_offset}", "{bkcrack_plaintext}"]
suggest_when = ["zip.known_plaintext"]
offline_safe = true
install = "https://github.com/kimci86/bkcrack/releases"
notes = "traditional ZipCrypto only (not WinZip AES). Once it prints the keys: bkcrack -C file.zip -c entry -k <keys> -d out.bin"

# --- Tools that only the "next steps" table points at (data/leads.toml): when
# `ctfc solve` finds no flag, it says what it DID find and which of these to try.
# Most have no `suggest_when`: they are reached through a lead, not a detect rule.
# `gui = true` marks a program with a window: the web page shows the command but
# no Run button (a window cannot open inside a web request).

[[tool]]
id = "sox_spectrogram"
name = "sox (spectrogram)"
kind = "local"
command_template = ["sox", "{input}", "-n", "remix", "-", "spectrogram", "-x", "2000", "-Y", "1000", "-o", "{input}.spectrogram.png"]
suggest_when = []
offline_safe = true
install = "apt install sox libsox-fmt-all"
notes = "draws the frequencies over time into a big PNG (all channels mixed): text or a dot pattern in the spectrogram is the commonest audio trick. Too small to read? zoom on the low frequencies with `rate 12k` before `spectrogram` (shows 0-6 kHz)"

[[tool]]
id = "sox_reverse"
name = "sox (play it backwards)"
kind = "local"
command_template = ["sox", "{input}", "{input}.reversed.wav", "reverse"]
suggest_when = []
offline_safe = true
install = "apt install sox libsox-fmt-all"
notes = "a voice that sounds like gibberish is often just reversed"

[[tool]]
id = "multimon_morse"
name = "multimon-ng (Morse)"
kind = "local"
command_template = ["multimon-ng", "-t", "wav", "-a", "MORSE_CW", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install multimon-ng"
notes = "decodes Morse beeps from a sound file. Over music or noise it may fail: then read the dots and dashes in the spectrogram and paste them into `ctfc auto 'text:.... ..'`"

[[tool]]
id = "multimon_dtmf"
name = "multimon-ng (DTMF)"
kind = "local"
command_template = ["multimon-ng", "-t", "wav", "-a", "DTMF", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install multimon-ng"
notes = "phone keypad tones -> digits. The digits are often A1Z26 or T9 text: paste them into `ctfc auto`"

[[tool]]
id = "sstv"
name = "sstv (SSTV decoder)"
kind = "local"
command_template = ["sstv", "-d", "{input}", "-o", "{input}.sstv.png"]
suggest_when = []
offline_safe = true
install = "pipx install sstv"
notes = "slow-scan TV: an image sent as a warbling sound (ISS, Robot36, Martin, Scottie). qsstv does the same with a window"

[[tool]]
id = "qsstv"
name = "QSSTV"
kind = "local"
gui = true
command_template = ["qsstv"]
suggest_when = []
offline_safe = true
install = "apt install qsstv"
notes = "graphical SSTV decoder: play the file into it (pavucontrol: record from the monitor of your output)"

[[tool]]
id = "audacity"
name = "Audacity"
kind = "local"
gui = true
command_template = ["audacity", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install audacity"
notes = "track menu -> Spectrogram view; Effect -> Reverse, Change speed. Look at each channel apart: a message can sit in one channel only"

[[tool]]
id = "sonic_visualiser"
name = "Sonic Visualiser"
kind = "local"
gui = true
command_template = ["sonic-visualiser", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install sonic-visualiser"
notes = "Layer -> Add Spectrogram, with a log frequency scale: shows text drawn in the high frequencies better than Audacity"

[[tool]]
id = "ffprobe"
name = "ffprobe"
kind = "local"
command_template = ["ffprobe", "-hide_banner", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install ffmpeg"
notes = "lists every stream of a media file: a second audio track, a subtitle track or an attached font is a hiding place"

[[tool]]
id = "ffmpeg_frames"
name = "ffmpeg (every frame as a PNG)"
kind = "local"
command_template = ["ffmpeg", "-hide_banner", "-i", "{input}", "{input}.frame_%04d.png"]
suggest_when = []
offline_safe = true
install = "apt install ffmpeg"
notes = "a GIF or video can flash the flag in one frame, or spread a QR code over several: then `zbarimg` each frame"

[[tool]]
id = "imagemagick_frames"
name = "ImageMagick (GIF frames)"
kind = "local"
command_template = ["convert", "-coalesce", "{input}", "{input}.frame_%03d.png"]
suggest_when = []
offline_safe = true
install = "apt install imagemagick"
notes = "splits an animated GIF into full frames (-coalesce redraws the partial ones); `identify {input}` lists the frame delays, which can be Morse or binary too"

[[tool]]
id = "identify"
name = "ImageMagick identify"
kind = "local"
command_template = ["identify", "-verbose", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install imagemagick"
notes = "every property of an image: the palette, the comment, the real size, the frame list"

[[tool]]
id = "pngcheck"
name = "pngcheck"
kind = "local"
command_template = ["pngcheck", "-vtp7", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install pngcheck"
notes = "lists every chunk with its CRC: a wrong CRC, an odd chunk or bytes after IEND. `ctfc repair` fixes the CRCs and the IHDR height"

[[tool]]
id = "stegsolve"
name = "Stegsolve"
kind = "local"
gui = true
command_template = ["stegsolve"]
suggest_when = []
offline_safe = true
install = "download stegsolve.jar (java -jar stegsolve.jar), and set tool_paths.stegsolve in ~/.ctfc/config.toml"
notes = "flip through the bit planes and colour filters one by one: text hidden in one plane, or a faint image, jumps out. Analyse -> Data Extract for a custom LSB order"

[[tool]]
id = "gimp"
name = "GIMP"
kind = "local"
gui = true
command_template = ["gimp", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install gimp"
notes = "Colors -> Curves / Levels pulls out text drawn in a colour one shade away from the background; Image -> Canvas size shows what a cropped header hid"

[[tool]]
id = "aperisolve"
name = "Aperi'Solve"
kind = "online"
url_template = "https://www.aperisolve.com/"
suggest_when = []
offline_safe = false
install = ""
notes = "runs zsteg, steghide, binwalk, exiftool and the bit planes on an uploaded image in one go. You upload the image yourself"

[[tool]]
id = "steghide_empty"
name = "steghide (empty passphrase)"
kind = "local"
command_template = ["steghide", "extract", "-sf", "{input}", "-p", "", "-f"]
suggest_when = []
offline_safe = true
install = "apt install steghide"
notes = "half the steghide challenges use no passphrase at all; if this fails, stegseek with a wordlist"

[[tool]]
id = "outguess"
name = "outguess"
kind = "local"
command_template = ["outguess", "-r", "{input}", "{input}.outguess.txt"]
suggest_when = []
offline_safe = true
install = "apt install outguess"
notes = "the other JPEG steganography tool (steghide's rival); -k for a key"

[[tool]]
id = "tshark_hierarchy"
name = "tshark (protocol list)"
kind = "local"
command_template = ["tshark", "-r", "{input}", "-q", "-z", "io,phs"]
suggest_when = []
offline_safe = true
install = "apt install tshark"
notes = "which protocols the capture holds, with the byte count of each: the odd one out (ICMP, DNS volume, USB, FTP-DATA) is usually the channel"

[[tool]]
id = "tshark_objects"
name = "tshark (export HTTP objects)"
kind = "local"
command_template = ["tshark", "-r", "{input}", "-q", "--export-objects", "http,{input}.http_objects"]
suggest_when = []
offline_safe = true
install = "apt install tshark"
notes = "writes every file downloaded over HTTP into a folder (also smb, imf, tftp, ftp-data instead of http)"

[[tool]]
id = "wireshark"
name = "Wireshark"
kind = "local"
gui = true
command_template = ["wireshark", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install wireshark"
notes = "Statistics -> Conversations and Protocol Hierarchy, then right click -> Follow -> TCP/UDP stream"

[[tool]]
id = "aircrack"
name = "aircrack-ng"
kind = "local"
command_template = ["aircrack-ng", "-w", "{wordlist}", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install aircrack-ng"
notes = "cracks the WPA handshake in the capture with a wordlist; then decrypt the traffic with airdecap-ng -p <passphrase> -e <SSID> capture"

[[tool]]
id = "hcxpcapngtool"
name = "hcxpcapngtool"
kind = "local"
command_template = ["hcxpcapngtool", "-o", "{input}.22000", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install hcxtools"
notes = "turns the handshake into a hashcat line: hashcat -m 22000 capture.22000 wordlist (GPU, much faster than aircrack)"

[[tool]]
id = "vol_info"
name = "Volatility 3 (windows.info)"
kind = "local"
command_template = ["vol", "-f", "{input}", "windows.info"]
suggest_when = []
offline_safe = true
install = "pipx install volatility3 (or set tool_paths.vol in ~/.ctfc/config.toml)"
notes = "is it a Windows memory image, and which build? Then windows.pslist, windows.cmdline, windows.filescan, windows.dumpfiles, windows.hashdump. Linux: banners.Banners"

[[tool]]
id = "vol_pslist"
name = "Volatility 3 (windows.pstree)"
kind = "local"
command_template = ["vol", "-f", "{input}", "windows.pstree"]
suggest_when = []
offline_safe = true
install = "pipx install volatility3 (or set tool_paths.vol in ~/.ctfc/config.toml)"
notes = "the process tree: the odd process (notepad.exe, mspaint.exe, a renamed svchost) is the one to dump with windows.memmap --dump --pid N"

[[tool]]
id = "vol_cmdline"
name = "Volatility 3 (windows.cmdline)"
kind = "local"
command_template = ["vol", "-f", "{input}", "windows.cmdline"]
suggest_when = []
offline_safe = true
install = "pipx install volatility3 (or set tool_paths.vol in ~/.ctfc/config.toml)"
notes = "every process's command line: a file name, a password or an encoded PowerShell often sits right there"

[[tool]]
id = "strings_wide"
name = "strings (UTF-16)"
kind = "local"
command_template = ["strings", "-n", "6", "-el", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install binutils"
notes = "Windows writes text as UTF-16: plain `strings` misses all of it. Pipe it into grep -i for a name or a prefix"

[[tool]]
id = "strings_ascii"
name = "strings"
kind = "local"
command_template = ["strings", "-n", "8", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install binutils"
notes = "the printable runs; long base64 / hex runs in there can be pasted into `ctfc auto`"

[[tool]]
id = "binwalk_entropy"
name = "binwalk (entropy graph)"
kind = "local"
command_template = ["binwalk", "-E", "-N", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install binwalk"
notes = "where the high-entropy (encrypted / compressed) regions start and stop: a block of 1.0 inside low entropy is the payload to cut out"

[[tool]]
id = "xxd_head"
name = "xxd (first bytes)"
kind = "local"
command_template = ["xxd", "-l", "256", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install xxd"
notes = "look at the header yourself: a magic one byte off, reversed, XORed (the same byte everywhere a header has zeros) or a format ctfc does not know"

[[tool]]
id = "file"
name = "file"
kind = "local"
command_template = ["file", "-k", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install file"
notes = "libmagic knows thousands more formats than ctfc's table; -k lists every match, not just the first"

[[tool]]
id = "pdftotext"
name = "pdftotext"
kind = "local"
command_template = ["pdftotext", "-layout", "{input}", "-"]
suggest_when = []
offline_safe = true
install = "apt install poppler-utils"
notes = "the text as drawn on the page, including white-on-white text and text under an image"

[[tool]]
id = "pdfimages"
name = "pdfimages"
kind = "local"
command_template = ["pdfimages", "-all", "-list", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install poppler-utils"
notes = "lists the embedded images (drop -list and add an output prefix to save them): a flag under an image, or a stego image"

[[tool]]
id = "qpdf_qdf"
name = "qpdf (uncompressed copy)"
kind = "local"
command_template = ["qpdf", "--qdf", "--object-streams=disable", "{input}", "{input}.qdf.pdf"]
suggest_when = []
offline_safe = true
install = "apt install qpdf"
notes = "rewrites the PDF with every stream decompressed, so you can read it in a text editor; also opens a PDF with an owner password"

[[tool]]
id = "apktool"
name = "apktool"
kind = "local"
command_template = ["apktool", "d", "-f", "{input}", "-o", "{input}.apktool"]
suggest_when = []
offline_safe = true
install = "apt install apktool"
notes = "decodes the APK's binary XML (AndroidManifest, res/values/strings.xml) and the smali code; then grep -r the folder"

[[tool]]
id = "jadx"
name = "jadx"
kind = "local"
command_template = ["jadx", "-d", "{input}.jadx", "{input}"]
suggest_when = []
offline_safe = true
install = "https://github.com/skylot/jadx/releases"
notes = "decompiles the DEX back to Java source: read the class that builds the flag; then `ctfc lens` on it"

[[tool]]
id = "sqlite3"
name = "sqlite3"
kind = "local"
command_template = ["sqlite3", "{input}", ".dump"]
suggest_when = []
offline_safe = true
install = "apt install sqlite3"
notes = "every table as SQL. Deleted rows survive in free pages: `ctfc sqlite` reads those, sqlite3 does not"

[[tool]]
id = "photorec"
name = "PhotoRec"
kind = "local"
gui = true
command_template = ["photorec", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install testdisk"
notes = "recovers deleted files by their content, without a file system: for a damaged disk image or a raw dump"

[[tool]]
id = "ghidra"
name = "Ghidra"
kind = "local"
gui = true
command_template = ["ghidraRun"]
suggest_when = []
offline_safe = true
install = "https://github.com/NationalSecurityAgency/ghidra/releases"
notes = "a binary that builds or checks the flag itself is reverse engineering: decompile the function that compares the input"

[[tool]]
id = "secretsdump"
name = "secretsdump.py (impacket)"
kind = "local"
command_template = ["secretsdump.py", "-sam", "{input}", "-system", "SYSTEM", "LOCAL"]
suggest_when = []
offline_safe = true
install = "pipx install impacket"
notes = "decrypts the NT hashes of a SAM hive with the boot key of the SYSTEM hive (give the real SYSTEM path); prints user:rid:lm:nt lines"

[[tool]]
id = "samdump2"
name = "samdump2"
kind = "local"
command_template = ["samdump2", "SYSTEM", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install samdump2"
notes = "the same as secretsdump, older; fails on Windows 10+ hives that use AES instead of RC4"

[[tool]]
id = "stegsnow"
name = "stegsnow (SNOW whitespace)"
kind = "local"
command_template = ["stegsnow", "-C", "{input}"]
suggest_when = []
offline_safe = true
install = "apt install stegsnow"
notes = "reads a message hidden as spaces and tabs at the ends of lines (SNOW); add -p <password> when it prints garbage, the password is often elsewhere in the challenge"
