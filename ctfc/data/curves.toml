# Elliptic curves, for ECDSA nonce reuse (core/signatures.py).
#
# Short Weierstrass form: y^2 = x^3 + a*x + b over GF(p), base point G of order n.
# Only `n` is needed to recover a private key from two signatures that share a
# nonce; the rest is there so the recovered key can be *verified* by computing
# d*G and comparing it with the public key.
#
# [[curve]]
#   id      : what to pass to --curve
#   name    : how a write-up would call it
#   aliases : other names the same curve goes by
#   p,a,b   : the field and the curve equation
#   gx,gy   : the base point
#   n       : its order (the modulus every scalar is reduced by)
#
# The test suite checks, for every curve here, that G is on the curve and that
# n*G is the point at infinity - so a typo in these constants cannot survive.

[[curve]]
id = "secp256k1"
name = "secp256k1 (Bitcoin, Ethereum)"
aliases = ["k1", "bitcoin"]
p = "0xfffffffffffffffffffffffffffffffffffffffffffffffffffffffefffffc2f"
a = "0x0"
b = "0x7"
gx = "0x79be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798"
gy = "0x483ada7726a3c4655da4fbfc0e1108a8fd17b448a68554199c47d08ffb10d4b8"
n = "0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141"

