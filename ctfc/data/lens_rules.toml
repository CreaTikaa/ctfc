# This file is written by hand. Each [[rule]] is one thing Code Lens can
# recognise in a script that is not Python (Python uses `ast`, see lens_python.py).
#
# Fields:
#   id         short unique name, shown in the report ("ps.frombase64")
#   languages  which languages the rule applies to
#   regex      Python regular expression, matched against the whole source
#   explain    what it means, in plain words (shown to the user)
#   operation  codegen step name when the rule is a data transformation:
#              base64 / base64url / base32 / hex / zlib / gzip / bz2 / lzma /
#              reverse / utf16le / xor / cipher   (empty = not a transformation)
#              Prefix with "cipher:" to give the cipher and mode, e.g.
#              operation = "cipher", cipher = "aes", mode = "cbc".
#   direction  "decode" (the script undoes something), "encode", or "both"
#   capture    what group 1 of the regex holds, when it holds something:
#              blob / key / iv / nonce / salt / password / url / path / command
#   capture_as how the captured text should be read: "text" (default),
#              "base64", "hex", "charcodes" (a list of numbers), "utf16le_b64"
#   behaviour  when the rule is not about data: execute / network / filesystem /
#              persistence / process
#
# Keep the regexes simple and readable: a rule that is hard to read is a rule
# nobody will fix during a CTF.

# ---------------------------------------------------------------------------
# PowerShell
# ---------------------------------------------------------------------------

[[rule]]
id = "ps.frombase64"
languages = ["powershell"]
regex = '''\[(?:System\.)?Convert\]::FromBase64String\(\s*['"]([A-Za-z0-9+/=\s]{16,})['"]'''
explain = "decodes an embedded base64 string ([Convert]::FromBase64String)"
operation = "base64"
direction = "decode"
capture = "blob"

[[rule]]
id = "ps.frombase64.var"
languages = ["powershell"]
regex = '''\[(?:System\.)?Convert\]::FromBase64String\('''
explain = "decodes base64 ([Convert]::FromBase64String)"
operation = "base64"
direction = "decode"

[[rule]]
id = "ps.tobase64"
languages = ["powershell"]
regex = '''\[(?:System\.)?Convert\]::ToBase64String\('''
explain = "encodes to base64 ([Convert]::ToBase64String)"
operation = "base64"
direction = "encode"

[[rule]]
id = "ps.encodedcommand"
languages = ["powershell", "bash", "unknown"]
regex = '''(?:-enc(?:odedcommand)?|-ec)\s+([A-Za-z0-9+/=]{20,})'''
explain = "runs a base64 UTF-16LE command (powershell -EncodedCommand)"
operation = "base64"
direction = "decode"
capture = "blob"
behaviour = "execute"

[[rule]]
id = "ps.bxor"
languages = ["powershell"]
regex = '''-bxor\s*(?:\$?\w+|0x[0-9a-fA-F]{1,2}|\d{1,3})'''
explain = "XORs the data (-bxor)"
operation = "xor"
direction = "both"

[[rule]]
id = "ps.bxor.literal"
languages = ["powershell"]
regex = '''-bxor\s*(0x[0-9a-fA-F]{1,2}|\d{1,3})\b'''
explain = "XORs with a single byte"
operation = "xor"
direction = "both"
capture = "key"
capture_as = "number"

[[rule]]
id = "ps.aes"
languages = ["powershell"]
regex = '''(?:New-Object\s+)?(?:System\.Security\.Cryptography\.)?(?:AesManaged|AesCryptoServiceProvider|RijndaelManaged)'''
explain = "AES through .NET System.Security.Cryptography"
operation = "cipher"
cipher = "aes"
mode = "cbc"
direction = "decode"

[[rule]]
id = "ps.aes.create"
languages = ["powershell"]
regex = '''\[(?:System\.Security\.Cryptography\.)?Aes\]::Create\(\)'''
explain = "AES via .NET ([System.Security.Cryptography.Aes]::Create())"
operation = "cipher"
cipher = "aes"
mode = "cbc"
direction = "decode"

[[rule]]
id = "ps.aes.key"
languages = ["powershell"]
regex = '''\.Key\s*=\s*(?:\[byte\[\]\]\s*)?[@(]\(?\s*((?:0x[0-9a-fA-F]{1,2}\s*,\s*){7,}0x[0-9a-fA-F]{1,2})'''
explain = "the AES key, written as a byte array"
capture = "key"
capture_as = "charcodes"

[[rule]]
id = "ps.aes.iv"
languages = ["powershell"]
regex = '''\.IV\s*=\s*(?:\[byte\[\]\]\s*)?[@(]\(?\s*((?:0x[0-9a-fA-F]{1,2}\s*,\s*){7,}0x[0-9a-fA-F]{1,2})'''
explain = "the AES IV, written as a byte array"
capture = "iv"
capture_as = "charcodes"

[[rule]]
id = "ps.charcodes.hex"
languages = ["powershell"]
regex = '''@\(\s*((?:0x[0-9a-fA-F]{1,2}\s*,\s*){7,}0x[0-9a-fA-F]{1,2})\s*\)'''
explain = "a string hidden as an array of byte values"
capture = "blob"
capture_as = "charcodes"

[[rule]]
id = "ps.charcodes.decimal"
languages = ["powershell"]
regex = '''@\(\s*((?:\d{1,3}\s*,\s*){7,}\d{1,3})\s*\)'''
explain = "a string hidden as an array of byte values (decimal)"
capture = "blob"
capture_as = "charcodes"

[[rule]]
id = "ps.securestring"
languages = ["powershell"]
regex = '''ConvertTo-SecureString\s+.*-Key\s+'''
explain = "decrypts a SecureString with a fixed key (ConvertTo-SecureString -Key): AES-CBC"
operation = "cipher"
cipher = "aes"
mode = "cbc"
direction = "decode"

[[rule]]
id = "ps.deflate"
languages = ["powershell"]
regex = '''(?:DeflateStream|GZipStream)'''
explain = "decompresses a stream (.NET DeflateStream/GZipStream)"
operation = "deflate"
direction = "decode"

[[rule]]
id = "ps.download"
languages = ["powershell"]
regex = '''(?:DownloadFile|DownloadString|Invoke-WebRequest|Invoke-RestMethod|Start-BitsTransfer)'''
explain = "downloads a file from the network"
behaviour = "network"

[[rule]]
id = "ps.iex"
languages = ["powershell"]
regex = '''(?:Invoke-Expression|\biex\b)'''
explain = "runs the decoded string as code (Invoke-Expression)"
behaviour = "execute"

[[rule]]
id = "ps.start"
languages = ["powershell"]
regex = '''(?:Start-Process|\[Diagnostics\.Process\]::Start)'''
explain = "starts a process"
behaviour = "process"

[[rule]]
id = "ps.registry"
languages = ["powershell"]
regex = '''(?:New-ItemProperty|Set-ItemProperty|HKCU:|HKLM:)'''
explain = "writes to the Windows registry (persistence)"
behaviour = "persistence"

# ---------------------------------------------------------------------------
# JavaScript
# ---------------------------------------------------------------------------

[[rule]]
id = "js.atob"
languages = ["javascript"]
regex = '''atob\(\s*['"]([A-Za-z0-9+/=]{16,})['"]\s*\)'''
explain = "decodes an embedded base64 string (atob)"
operation = "base64"
direction = "decode"
capture = "blob"

[[rule]]
id = "js.atob.var"
languages = ["javascript"]
regex = '''\batob\('''
explain = "decodes base64 (atob)"
operation = "base64"
direction = "decode"

[[rule]]
id = "js.btoa"
languages = ["javascript"]
regex = '''\bbtoa\('''
explain = "encodes to base64 (btoa)"
operation = "base64"
direction = "encode"

[[rule]]
id = "js.buffer.base64"
languages = ["javascript"]
regex = '''Buffer\.from\(\s*['"]([A-Za-z0-9+/=]{16,})['"]\s*,\s*['"]base64['"]'''
explain = "decodes an embedded base64 string (Buffer.from(..., 'base64'))"
operation = "base64"
direction = "decode"
capture = "blob"

[[rule]]
id = "js.buffer.hex"
languages = ["javascript"]
regex = '''Buffer\.from\(\s*['"]([0-9a-fA-F]{32,})['"]\s*,\s*['"]hex['"]'''
explain = "reads bytes from a hex string (Buffer.from(..., 'hex'))"
operation = "hex"
direction = "decode"
capture = "blob"

[[rule]]
id = "js.xor.charcode"
languages = ["javascript"]
regex = '''charCodeAt\([^)]*\)\s*\^'''
explain = "XORs the characters one by one (charCodeAt ^ ...)"
operation = "xor"
direction = "both"

[[rule]]
id = "js.xor.literal"
languages = ["javascript"]
regex = '''\^\s*(0x[0-9a-fA-F]{1,2}|\d{1,3})\b'''
explain = "XORs with a single byte written in the code"
operation = "xor"
direction = "both"
capture = "key"
capture_as = "number"

[[rule]]
id = "js.cryptojs.aes"
languages = ["javascript"]
regex = '''CryptoJS\.AES\.(decrypt|encrypt)\('''
explain = "AES through CryptoJS (a passphrase goes through EVP_BytesToKey, like openssl)"
operation = "cipher"
cipher = "aes"
mode = "cbc"
direction = "decode"

[[rule]]
id = "js.cryptojs.passphrase"
languages = ["javascript"]
regex = '''CryptoJS\.AES\.(?:de|en)crypt\(\s*[^,]+,\s*['"]([^'"]{3,})['"]'''
explain = "the CryptoJS passphrase, in clear in the script"
capture = "password"

[[rule]]
id = "js.cryptojs.other"
languages = ["javascript"]
regex = '''CryptoJS\.(?:DES|TripleDES|RC4|Rabbit)\.'''
explain = "another CryptoJS cipher (DES / TripleDES / RC4 / Rabbit)"
operation = ""

[[rule]]
id = "js.node.crypto"
languages = ["javascript"]
regex = '''crypto\.create(?:De|En)cipheriv?\(\s*['"]([a-z0-9-]+)['"]'''
explain = "Node.js crypto: the cipher name says the algorithm and the mode"
capture = "command"

[[rule]]
id = "js.reverse"
languages = ["javascript"]
regex = '''\.split\(\s*['"]{2}\s*\)\.reverse\(\)\.join\(\s*['"]{2}\s*\)'''
explain = "reverses the string (split/reverse/join)"
operation = "reverse"
direction = "both"

[[rule]]
id = "js.fromcharcode"
languages = ["javascript"]
regex = '''String\.fromCharCode\(\s*((?:\d{1,3}\s*,\s*){7,}\d{1,3})'''
explain = "rebuilds a string from character codes"
capture = "blob"
capture_as = "charcodes"

[[rule]]
id = "js.charcode.array"
languages = ["javascript"]
# The codes are usually kept in an array and only turned into characters in a
# loop further down (`var a = [67, 89, ...]` ... `String.fromCharCode(a[i])`),
# so the array itself has to be recognised, not just a direct fromCharCode call.
regex = '''\[\s*((?:\d{1,3}\s*,\s*){7,}\d{1,3})\s*\]'''
explain = "holds a string as an array of character codes"
capture = "blob"
capture_as = "charcodes"

[[rule]]
id = "js.eval"
languages = ["javascript"]
regex = '''(?:\beval\(|new\s+Function\(|setTimeout\(\s*['"])'''
explain = "runs the decoded string as code (eval / new Function)"
behaviour = "execute"

[[rule]]
id = "js.network"
languages = ["javascript"]
regex = '''(?:XMLHttpRequest|fetch\(|https?\.get\(|require\(\s*['"]https?['"]\s*\))'''
explain = "talks to the network"
behaviour = "network"

[[rule]]
id = "js.childprocess"
languages = ["javascript"]
regex = '''child_process|execSync|spawnSync'''
explain = "runs a system command"
behaviour = "process"

# ---------------------------------------------------------------------------
# bash
# ---------------------------------------------------------------------------

[[rule]]
id = "sh.base64.decode"
languages = ["bash"]
regex = '''base64\s+(?:--decode|-d|-D)\b'''
explain = "decodes base64 (base64 -d)"
operation = "base64"
direction = "decode"

[[rule]]
id = "sh.base64.blob"
languages = ["bash"]
regex = '''echo\s+(?:-n\s+)?['"]?([A-Za-z0-9+/=]{24,})['"]?\s*\|\s*base64\s+(?:--decode|-d|-D)'''
explain = "an embedded base64 string piped into base64 -d"
operation = "base64"
direction = "decode"
capture = "blob"

[[rule]]
id = "sh.xxd"
languages = ["bash"]
regex = '''xxd\s+-r\s+-p|xxd\s+-p\s+-r'''
explain = "reads bytes from hex (xxd -r -p)"
operation = "hex"
direction = "decode"

[[rule]]
id = "sh.openssl.enc"
languages = ["bash"]
regex = '''openssl\s+(?:enc\s+)?(-d\s+)?-(aes|des|bf|rc4|camellia)[a-z0-9-]*'''
explain = "openssl enc: the cipher name gives the algorithm, the key size and the mode"
operation = "cipher"
cipher = "aes"
mode = "cbc"
direction = "decode"

[[rule]]
id = "sh.openssl.pass"
languages = ["bash"]
regex = '''-pass\s+pass:([^\s'"]+)'''
explain = "the openssl password, in clear on the command line"
capture = "password"

[[rule]]
id = "sh.openssl.k"
languages = ["bash"]
regex = '''-K\s+([0-9a-fA-F]{16,64})'''
explain = "the openssl key, as hex"
capture = "key"
capture_as = "hex"

[[rule]]
id = "sh.openssl.iv"
languages = ["bash"]
regex = '''-iv\s+([0-9a-fA-F]{16,32})'''
explain = "the openssl IV, as hex"
capture = "iv"
capture_as = "hex"

[[rule]]
id = "sh.openssl.command"
languages = ["bash"]
regex = '''(openssl\s+enc[^\n|>]*)'''
explain = "the full openssl command line"
capture = "command"

[[rule]]
id = "sh.gunzip"
languages = ["bash"]
regex = '''\b(?:gunzip|zcat|gzip\s+-d)\b'''
explain = "decompresses gzip"
operation = "gzip"
direction = "decode"

[[rule]]
id = "sh.rev"
languages = ["bash"]
regex = '''\|\s*rev\b'''
explain = "reverses the text (rev)"
operation = "reverse"
direction = "both"

[[rule]]
id = "sh.curl"
languages = ["bash"]
regex = '''\b(?:curl|wget)\b'''
explain = "downloads from the network"
behaviour = "network"

[[rule]]
id = "sh.pipe.shell"
languages = ["bash"]
regex = '''\|\s*(?:ba)?sh\b|\beval\s'''
explain = "runs the decoded output as a shell script"
behaviour = "execute"

[[rule]]
id = "sh.cron"
languages = ["bash"]
regex = '''crontab|/etc/cron|systemctl\s+enable'''
explain = "installs itself to run again later (persistence)"
behaviour = "persistence"

# ---------------------------------------------------------------------------
# VBScript
# ---------------------------------------------------------------------------

[[rule]]
id = "vbs.xor"
languages = ["vbs"]
regex = '''Chr\s*\(\s*Asc\s*\([^)]*\)\s*Xor\s*(\d{1,3}|&H[0-9A-Fa-f]{1,2})'''
explain = "XORs each character with a fixed byte (Chr(Asc(c) Xor n))"
operation = "xor"
direction = "both"
capture = "key"
capture_as = "number"

[[rule]]
id = "vbs.xor.literal"
languages = ["vbs"]
regex = '''\bXor\s+(\d{1,3}|&H[0-9A-Fa-f]{1,2})\b'''
explain = "XORs with a single byte written in the code"
operation = "xor"
direction = "both"
capture = "key"
capture_as = "number"

[[rule]]
id = "vbs.hex.midclng"
languages = ["vbs"]
regex = '''CLng\(\s*"&H"\s*&\s*Mid\('''
explain = "reads bytes from a hex string, two characters at a time (the usual VBS idiom)"
operation = "hex"
direction = "decode"

[[rule]]
id = "vbs.xor.any"
languages = ["vbs"]
regex = '''\bXor\b'''
explain = "XORs the data"
operation = "xor"
direction = "both"

[[rule]]
id = "vbs.base64"
languages = ["vbs"]
regex = '''(?:MSXML2\.DOMDocument|bin\.base64|DecodeBase64)'''
explain = "decodes base64 (the MSXML2 bin.base64 trick)"
operation = "base64"
direction = "decode"

[[rule]]
id = "vbs.network"
languages = ["vbs"]
regex = '''(?:MSXML2\.(?:XMLHTTP|ServerXMLHTTP)|WinHttp\.WinHttpRequest|ADODB\.Stream)'''
explain = "downloads from the network"
behaviour = "network"

[[rule]]
id = "vbs.run"
languages = ["vbs"]
regex = '''(?:WScript\.Shell|\.Run\s|\.Exec\s|Shell\.Application)'''
explain = "runs a command"
behaviour = "process"

[[rule]]
id = "vbs.execute"
languages = ["vbs"]
regex = '''\b(?:Execute|ExecuteGlobal|Eval)\s*\('''
explain = "runs the decoded string as code (Execute)"
behaviour = "execute"

[[rule]]
id = "vbs.filesystem"
languages = ["vbs"]
regex = '''Scripting\.FileSystemObject'''
explain = "reads or writes files"
behaviour = "filesystem"

# ---------------------------------------------------------------------------
# Any language: values worth extracting
# ---------------------------------------------------------------------------

[[rule]]
id = "any.url"
languages = ["powershell", "javascript", "bash", "vbs", "python", "unknown"]
regex = '''['"]([a-z][a-z0-9+.-]*://[^\s'"<>]{4,})['"]'''
explain = "a URL written in the script"
capture = "url"

[[rule]]
id = "any.blob.hex"
languages = ["powershell", "javascript", "bash", "vbs", "python", "unknown"]
regex = '''['"]((?:[0-9a-fA-F]{2}){32,})['"]'''
explain = "a long hex string: probably the payload"
capture = "blob"
# Kept as the TEXT written in the script: the recovery chain starts by decoding it.
capture_as = "text"

[[rule]]
id = "any.blob.base64"
languages = ["powershell", "javascript", "bash", "vbs", "python", "unknown"]
regex = '''['"]([A-Za-z0-9+/]{40,}={0,2})['"]'''
explain = "a long base64 string: probably the payload"
capture = "blob"

[[rule]]
id = "any.windows.path"
languages = ["powershell", "javascript", "bash", "vbs", "python", "unknown"]
regex = '''['"]((?:[A-Za-z]:\\|%[A-Z]+%\\|\\\\)[^'"\n]{3,})['"]'''
explain = "a Windows file path"
capture = "path"

[[rule]]
id = "any.key.variable"
languages = ["powershell", "javascript", "bash", "vbs", "unknown"]
regex = '''(?i)\$?(?:key|iv|salt|passphrase|password|secret)\w*\s*=\s*['"]([^'"\n]{4,64})['"]'''
explain = "a variable named like a key / IV / salt / password, with a literal value"
capture = "key"

# ---------------------------------------------------------------------------
# PHP
# ---------------------------------------------------------------------------
#
# The web category's language, and the one that was missing here. A PHP sample
# in a forensics challenge is almost always one of two things: a **web shell**
# (it reads $_GET/$_POST/$_COOKIE and hands it to eval or a shell) or a
# **crypter** (a payload wrapped in base64 -> gzinflate -> str_rot13, sometimes
# four layers deep). Both are exactly what these rules name.

[[rule]]
id = "php.base64.literal"
languages = ["php"]
regex = '''base64_decode\(\s*['"]([A-Za-z0-9+/=\s]{16,})['"]'''
explain = "decodes an embedded base64 string (base64_decode)"
operation = "base64"
direction = "decode"
capture = "blob"

[[rule]]
id = "php.base64"
languages = ["php"]
regex = '''base64_decode\('''
explain = "decodes base64 (base64_decode)"
operation = "base64"
direction = "decode"

[[rule]]
id = "php.base64.encode"
languages = ["php"]
regex = '''base64_encode\('''
explain = "encodes to base64 (base64_encode)"
operation = "base64"
direction = "encode"

[[rule]]
id = "php.gzinflate"
languages = ["php"]
regex = '''gzinflate\('''
explain = "inflates a raw DEFLATE stream (gzinflate) - the classic crypter layer"
# "deflate", not "zlib": PHP's gzinflate takes a *headerless* stream, which is
# zlib.decompress(data, -15) and not zlib.decompress(data). Getting this wrong
# makes the generated script fail on the one line that matters.
operation = "deflate"
direction = "decode"

[[rule]]
id = "php.gzuncompress"
languages = ["php"]
regex = '''gzuncompress\('''
explain = "inflates a zlib stream (gzuncompress)"
operation = "zlib"
direction = "decode"

[[rule]]
id = "php.gzdecode"
languages = ["php"]
regex = '''gzdecode\('''
explain = "decompresses a gzip stream (gzdecode)"
operation = "gzip"
direction = "decode"

[[rule]]
id = "php.rot13"
languages = ["php"]
regex = '''str_rot13\('''
explain = "rotates the letters by 13 (str_rot13)"
operation = "rot13"
direction = "both"

[[rule]]
id = "php.strrev"
languages = ["php"]
regex = '''strrev\('''
explain = "reverses the string (strrev)"
operation = "reverse"
direction = "both"

[[rule]]
id = "php.hex2bin"
languages = ["php"]
regex = '''hex2bin\(\s*['"]([0-9a-fA-F]{16,})['"]'''
explain = "decodes a hex string (hex2bin)"
operation = "hex"
direction = "decode"
capture = "blob"
capture_as = "hex"

[[rule]]
id = "php.pack.hex"
languages = ["php"]
regex = '''pack\(\s*['"]H\*?['"]\s*,\s*['"]([0-9a-fA-F]{16,})['"]'''
explain = "decodes a hex string (pack('H*', ...))"
operation = "hex"
direction = "decode"
capture = "blob"
capture_as = "hex"

[[rule]]
id = "php.urldecode"
languages = ["php"]
regex = '''(?:raw)?urldecode\('''
explain = "undoes percent-encoding (urldecode)"
operation = "url"
direction = "decode"

[[rule]]
id = "php.openssl.decrypt"
languages = ["php"]
regex = '''openssl_decrypt\('''
explain = "decrypts with OpenSSL (openssl_decrypt): the cipher name is its second argument"
operation = "cipher"
cipher = "aes"
mode = "cbc"
direction = "decode"

[[rule]]
id = "php.openssl.encrypt"
languages = ["php"]
regex = '''openssl_encrypt\('''
explain = "encrypts with OpenSSL (openssl_encrypt)"
operation = "cipher"
cipher = "aes"
mode = "cbc"
direction = "encode"

[[rule]]
id = "php.openssl.cipher"
languages = ["php"]
regex = '''openssl_(?:de|en)crypt\(\s*[^,]+,\s*['"]([A-Za-z0-9-]{3,20})['"]'''
explain = "the OpenSSL cipher and mode named in the call"
capture = "command"

[[rule]]
id = "php.mcrypt"
languages = ["php"]
regex = '''mcrypt_(?:de|en)crypt\(\s*MCRYPT_([A-Z0-9_]+)'''
explain = "uses the old mcrypt extension; RIJNDAEL_128 is AES-128 (block size, not key size)"
operation = "cipher"
cipher = "aes"
direction = "both"
capture = "command"

[[rule]]
id = "php.key.literal"
languages = ["php"]
regex = '''\$(?:key|k|secret|passphrase)\s*=\s*['"]([^'"\n]{4,64})['"]'''
explain = "a key or passphrase written in the script"
capture = "key"

[[rule]]
id = "php.iv.literal"
languages = ["php"]
regex = '''\$(?:iv|nonce)\s*=\s*['"]([^'"\n]{4,64})['"]'''
explain = "an IV or nonce written in the script"
capture = "iv"

[[rule]]
id = "php.password.literal"
languages = ["php"]
regex = '''\$(?:pass|password|pwd|mdp)\s*=\s*['"]([^'"\n]{3,64})['"]'''
explain = "a password written in the script"
capture = "password"

[[rule]]
id = "php.xor.loop"
languages = ["php"]
regex = '''\^\s*(?:ord\(\s*)?\$[A-Za-z_][A-Za-z0-9_]*\s*[\[{]'''
explain = "XORs the data byte by byte against a key (the ^ operator inside a loop)"
operation = "xor"
direction = "both"

[[rule]]
id = "php.md5.key"
languages = ["php"]
regex = '''(?:md5|sha1|hash)\(\s*['"]?(?:sha\d+['"]\s*,\s*)?[^)]*\)'''
explain = "derives the key by hashing something (md5/sha1/hash) - try the same digest in `ctfc sym --pass`"

[[rule]]
id = "php.eval"
languages = ["php"]
regex = '''\beval\s*\('''
explain = "runs the decoded string as PHP (eval): whatever came before it is the payload"
behaviour = "execute"

[[rule]]
id = "php.assert"
languages = ["php"]
regex = '''\bassert\s*\('''
explain = "runs its argument as PHP (assert, the quiet eval)"
behaviour = "execute"

[[rule]]
id = "php.create_function"
languages = ["php"]
regex = '''create_function\s*\('''
explain = "builds a function from a string and runs it (create_function - an eval in disguise)"
behaviour = "execute"

[[rule]]
id = "php.preg.e"
languages = ["php"]
# The /e modifier lives *inside* the pattern string - preg_replace('/(.*)/e', ...)
# - so the regex has to look for it before the closing quote, not after.
regex = '''preg_replace\s*\(\s*['"][^'"\n]*[/#~][a-zA-Z]{0,6}e[a-zA-Z]{0,6}['"]'''
explain = "preg_replace with the /e modifier: the replacement is executed as PHP"
behaviour = "execute"

[[rule]]
id = "php.shell"
languages = ["php"]
regex = '''\b(?:system|shell_exec|passthru|popen|proc_open|exec)\s*\('''
explain = "runs a system command"
behaviour = "process"

[[rule]]
id = "php.request"
languages = ["php"]
regex = '''\$_(?:GET|POST|REQUEST|COOKIE|FILES)\s*\[\s*['"]?([A-Za-z0-9_]{1,32})'''
explain = "takes its input from the HTTP request: this is a web shell, and the captured name is the parameter it expects"
behaviour = "network"
capture = "command"

[[rule]]
id = "php.file.read"
languages = ["php"]
regex = '''file_get_contents\(\s*['"]([^'"\n]{3,200})['"]'''
explain = "reads a file or a URL (file_get_contents)"
capture = "path"

[[rule]]
id = "php.file.write"
languages = ["php"]
regex = '''(?:file_put_contents|fwrite|fputs)\s*\('''
explain = "writes a file"
behaviour = "filesystem"

[[rule]]
id = "php.curl"
languages = ["php"]
regex = '''curl_(?:exec|setopt|init)\s*\('''
explain = "makes an HTTP request with cURL"
behaviour = "network"

[[rule]]
id = "php.url"
languages = ["php"]
regex = '''['"](https?://[^'"\s]{6,200})['"]'''
explain = "a URL written in the script"
capture = "url"

[[rule]]
id = "php.blob.variable"
languages = ["php"]
regex = '''\$[A-Za-z_][A-Za-z0-9_]*\s*=\s*['"]([A-Za-z0-9+/=]{40,})['"]\s*;'''
explain = "a long base64 string assigned to a variable: the payload the chain below decodes"
capture = "blob"
capture_as = "base64"
