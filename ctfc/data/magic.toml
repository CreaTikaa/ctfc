# File signatures ("magic bytes") and text prefixes used by detect.py and scoring.py.
#
# [[sig]]  = binary signature
#   name    : human name
#   hex     : the signature bytes, in hex
#   offset  : where the signature must be (default 0)
#   weak    : true for very short signatures (2-3 bytes). Weak signatures are only
#             trusted at offset 0 and are skipped when scanning for embedded files.
#   end     : optional end-of-file marker (hex), used to find data appended after the file
#   end_rule: "first" or "last" occurrence of the end marker (default "last")
#   ext     : usual file extension
#
# [[prefix]] = text rule (regex) for encoded formats, keys, hashes...
#   id      : rule id (used by the external tool bridge later)
#   regex   : Python regex, searched in the text form of the input
#   label   : what it is
#   hint    : what to do next
#   strength: 0..1, how sure we are when it matches
#
# To add a format: copy a block and change the values.

