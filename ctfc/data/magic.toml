# =====================================================================
# Text prefixes / shapes
# =====================================================================

[[prefix]]
id = "openssl.salted_b64"
regex = '^\s*U2FsdGVkX1'
label = "base64 of 'Salted__': openssl enc output"
hint = "base64-decode, then: openssl enc -d -aes-256-cbc -md md5|sha256 [-pbkdf2] -pass pass:..."
strength = 0.9

[[prefix]]
id = "fernet"
regex = '^\s*gAAAAA[A-Za-z0-9_\-]{50,}={0,2}\s*$'
label = "Fernet token (AES-128-CBC + HMAC, Python 'cryptography')"
hint = "needs the 32-byte urlsafe-base64 Fernet key"
strength = 0.9

[[prefix]]
id = "pem"
regex = '-----BEGIN ([A-Z0-9 ]+)-----'
label = "PEM block"
hint = "keys: ctfc rsa / openssl pkey -in file -text"
strength = 0.95

[[prefix]]
id = "jwt"
regex = '^\s*eyJ[A-Za-z0-9_\-]+\.eyJ[A-Za-z0-9_\-]*\.[A-Za-z0-9_\-]*\s*$'
label = "JSON Web Token (header.payload.signature, base64url)"
hint = "ctfc jwt <token>   (decodes it, tries the HMAC secret, flags alg=none)"
strength = 0.95

[[prefix]]
id = "hash.mysqlna"
regex = '^\s*\$mysqlna\$[0-9a-fA-F]+\*[0-9a-fA-F]+\s*$'
label = "MySQL native authentication challenge/response"
hint = "hashcat -m 11200"
strength = 0.95

[[prefix]]
id = "hash.bcrypt"
regex = '^\s*\$2[abxy]\$\d{2}\$[./A-Za-z0-9]{53}\s*$'
label = "bcrypt hash"
hint = "hashcat -m 3200 (slow: use a small wordlist)"
strength = 0.95

[[prefix]]
id = "hash.md5crypt"
regex = '^\s*\$1\$[^$]{0,8}\$[./A-Za-z0-9]{22}\s*$'
label = "md5crypt hash"
hint = "hashcat -m 500"
strength = 0.95

[[prefix]]
id = "hash.sha256crypt"
regex = '^\s*\$5\$'
label = "sha256crypt hash"
hint = "hashcat -m 7400"
strength = 0.9

[[prefix]]
id = "hash.sha512crypt"
regex = '^\s*\$6\$'
label = "sha512crypt hash (Linux /etc/shadow)"
hint = "hashcat -m 1800"
strength = 0.9

[[prefix]]
id = "hash.yescrypt"
regex = '^\s*\$y\$'
label = "yescrypt hash (recent Linux /etc/shadow)"
hint = "john --format=crypt (hashcat has no yescrypt mode)"
strength = 0.9

[[prefix]]
id = "hash.argon2"
regex = '^\s*\$argon2(id|i|d)\$'
label = "Argon2 hash"
hint = "hashcat -m 34000 (recent versions) / john"
strength = 0.9

[[prefix]]
id = "hash.krb5asrep"
regex = '^\s*\$krb5asrep\$'
label = "Kerberos AS-REP roast hash"
hint = "hashcat -m 18200"
strength = 0.95

[[prefix]]
id = "hash.krb5tgs"
regex = '^\s*\$krb5tgs\$'
label = "Kerberos TGS-REP (kerberoast) hash"
hint = "hashcat -m 13100 (RC4) / 19600 / 19700 (AES)"
strength = 0.95

[[prefix]]
id = "hash.netntlmv2"
regex = '^\s*[^:\s]+::[^:\s]+:[0-9a-fA-F]{16}:[0-9a-fA-F]{32}:[0-9a-fA-F]+\s*$'
label = "NetNTLMv2 challenge/response (Responder format)"
hint = "hashcat -m 5600"
strength = 0.95

[[prefix]]
id = "ssh.pubkey"
regex = '^\s*(ssh-rsa|ssh-ed25519|ssh-dss|ecdsa-sha2-\S+) AAAA'
label = "OpenSSH public key"
hint = "ssh-keygen -l -f key.pub; RSA ones can be parsed by ctfc rsa (M5)"
strength = 0.95

[[prefix]]
id = "putty"
regex = '^\s*PuTTY-User-Key-File'
label = "PuTTY private key (.ppk)"
hint = "puttygen key.ppk -O private-openssh -o key.pem; putty2john for encrypted ones"
strength = 0.95

[[prefix]]
id = "ascii85"
regex = '^\s*<~[\s\S]*~>\s*$'
label = "Ascii85 block (<~ ... ~>)"
hint = "base64.a85decode(data, adobe=True)"
strength = 0.9

[[prefix]]
id = "uuencode"
regex = '^\s*begin [0-7]{3} \S+'
label = "uuencoded file"
hint = "uudecode file / python: binascii.a2b_uu per line"
strength = 0.9

[[prefix]]
id = "data_uri"
regex = 'data:[\w/+.\-]+;base64,'
label = "data: URI with base64 payload"
hint = "base64-decode the part after the comma"
strength = 0.85

[[prefix]]
id = "escapes.hex"
regex = '(\\x[0-9a-fA-F]{2}){4,}'
label = "\\xNN escaped bytes"
hint = "hex-decode (shellcode? look at it statically, never run it)"
strength = 0.8

[[prefix]]
id = "escapes.unicode"
regex = '(\\u[0-9a-fA-F]{4}){3,}'
label = "\\uNNNN escaped characters (JS/JSON)"
hint = "unescape: json.loads('\"...\"')"
strength = 0.8

[[prefix]]
id = "charcodes"
regex = '(\d{2,3}\s*,\s*){8,}\d{2,3}'
label = "list of character codes (String.fromCharCode / [char] arrays)"
hint = "bytes([int(x) for x in s.split(',')])"
strength = 0.7

[[prefix]]
id = "powershell.encodedcommand"
regex = '(?i)-e(nc(odedcommand)?)?\s+[A-Za-z0-9+/=]{20,}'
label = "PowerShell -EncodedCommand (base64 of UTF-16LE text)"
hint = "base64-decode, then decode as UTF-16LE"
strength = 0.9

[[prefix]]
id = "morse"
regex = '^\s*[.\-]{1,7}([ /]+[.\-]{1,7}){3,}\s*$'
label = "Morse code"
hint = "dcode.fr Morse / CyberChef 'From Morse Code'"
strength = 0.85

[[prefix]]
id = "brainfuck"
regex = '^\s*[+\-<>\[\].,\s]{20,}$'
label = "Brainfuck program"
hint = "dcode.fr Brainfuck interpreter (do not run untrusted programs locally)"
strength = 0.6
